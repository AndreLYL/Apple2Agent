name: Publication privacy checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --retry 3 -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - run: python3 scripts/check-public-tree.py
      - name: Scan all reachable history
        run: '"${{ runner.temp }}/gitleaks" git --redact --no-banner --log-opts="--all" --config=.gitleaks.toml'
      - name: Scan checked-out files
        run: '"${{ runner.temp }}/gitleaks" dir --redact --no-banner --config=.gitleaks.toml .'
