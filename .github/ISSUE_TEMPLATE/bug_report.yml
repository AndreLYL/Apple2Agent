name: Bug report
description: Report a reproducible problem using synthetic data.
body:
  - type: markdown
    attributes:
      value: |
        Do not upload credentials, config.json, databases, backups, real mail/event content, or account screenshots.
        For vulnerabilities, follow SECURITY.md instead of disclosing details here.
  - type: input
    id: version
    attributes:
      label: Apple2Agent version
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: macOS version, architecture and Node version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction using synthetic data
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
      description: Include error codes only; redact all personal identifiers and secrets.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I checked this report and removed private data and credentials.
          required: true
